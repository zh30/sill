[package]
name = "sill"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "sill CLI — state, export, import, bench"

[[bin]]
name = "sill"
path = "src/main.rs"

[dependencies]
sill-core = { path = "../../core/sill-core" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
