name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  rust:
    strategy:
      matrix:
        # macOS rust jobs removed 2026-11-10 to cut Actions cost; Linux covers
        # fmt/clippy/test and the CLI smoke.
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace -- -D warnings
      - run: cargo test --workspace
      - name: CLI smoke
        run: |
          cargo build -p sill
          BIN=target/debug/sill
          "$BIN" state agent=demo status=awaiting pid=$$
          "$BIN" import ghostty --path /nonexistent 2>&1 | head -1 || true

  swift-macos:
    # apps/macos is a Swift package and needs a macOS/Xcode runner. That
    # runner is expensive, so this job runs only when manually dispatched
    # (2026-11-10 cost cut).
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: swift build
        working-directory: apps/macos
        run: swift build
